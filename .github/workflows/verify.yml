name: EventFulfill verification
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java and Gateway verification
        shell: pwsh
        run: ./scripts/verify.ps1

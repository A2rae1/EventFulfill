<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventFulfill · 活动与履约</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body><div id="app" v-cloak>
  <header><a class="brand" href="/">EF<span>EventFulfill</span></a><nav v-if="account"><button v-for="item in tabs" :class="{active:page===item.id}" @click="page=item.id;refresh()">{{item.label}}</button></nav><div class="identity" v-if="account">{{account.user}}<button class="subtle" @click="logout">退出</button></div></header>
  <main>
    <section class="login" v-if="!account"><div class="eyebrow">活动预约 · 有序候补 · 安心入场</div><h1>每一个名额，<br>都有明确的去向。</h1><p>预约活动、查看候补进度，或管理你的下一场活动。</p><form @submit.prevent="login"><label>账号<input v-model="username" required autocomplete="username"></label><label>密码<input v-model="password" type="password" required autocomplete="current-password"></label><button class="primary" :disabled="busy">登录</button></form></section>
    <template v-else>
      <div class="page-heading"><div><div class="eyebrow">EVENTFULFILL / {{page==='agent'?'REPOLENS':'WORKSPACE'}}</div><h1>{{headings[page]}}</h1></div><button class="secondary" @click="refresh">刷新</button></div>
      <div class="notice" role="status" v-if="notice">{{notice}}<button @click="notice=''">×</button></div>
      <section v-if="page==='discover'"><p class="intro">报名先受理，再分配名额；名额已满时可有序候补。</p><div class="grid"><article class="card" v-for="s in sessions" :key="s.id"><div class="badge">{{s.priceCents===0?'免费活动':'模拟付费'}}</div><h2>{{s.title}}</h2><p>已占用 {{s.used}} / {{s.capacity}} 个名额</p><div class="progress"><i :style="{width:100*s.used/s.capacity+'%'}"></i></div><dl><div><dt>确认期限</dt><dd>{{s.holdSeconds}} 秒</dd></div><div><dt>费用</dt><dd>{{money(s.priceCents)}}</dd></div></dl><button class="primary" :disabled="busy" @click="reserve(s)">{{s.used>=s.capacity?'加入候补':'预约活动'}}</button></article></div><div class="empty" v-if="!sessions.length">还没有已发布场次。主办方发布后会出现在这里。</div></section>
      <section v-if="page==='orders'"><p class="intro">受理成功不等于预约成功。请在期限内确认名额，候补邀请也有确认期限。</p><article class="row-card" v-for="b in bookings" :key="b.id"><div><span class="badge" :class="b.status">{{labels[b.status]||b.status}}</span><h2>{{sessionTitle(b.sessionId)}}</h2><p class="mono">{{b.id.slice(0,8)}}</p><p v-if="orderDetails[b.id]">确认截止：{{time(orderDetails[b.id].expiresAt)}} · {{money(orderDetails[b.id].priceCents)}}</p></div><div class="actions"><button v-if="b.status==='HELD'" class="primary" @click="confirm(b)">{{orderDetails[b.id]?.priceCents>0?'模拟支付并确认':'确认名额'}}</button><button v-if="['ACCEPTED','WAITING','HELD','CONFIRMED'].includes(b.status)" class="secondary" @click="cancel(b)">取消预约</button><button v-if="b.status==='CONFIRMED'" class="secondary" @click="showTicket(b)">查看入场凭证</button></div></article><div class="empty" v-if="!bookings.length">还没有预约。先去发现一场活动。</div><div class="card ticket" v-if="ticket"><h2>入场凭证</h2><p>交给本活动核验人员，凭证仅可使用一次。</p><code>{{ticket.token}}</code><p>{{labels[ticket.status]||ticket.status}}</p><button @click="ticket=null">收起</button></div></section>
      <section v-if="page==='manage'"><article class="card"><h2>履约摘要</h2><p>最多读取20个已发布场次。暂不可用的项不会显示成零。</p><button @click="loadSummaries" :disabled="busy">刷新履约摘要</button><p v-for="s in summaries">{{sessionTitle(s.sessionId)}} · {{s.status==='OK'?'请求 '+s.counts.requests+' / 候补 '+s.counts.waiting+' / 已核验 '+s.counts.checkedIn:'暂不可用，请稍后重试'}}</p></article><div class="two-columns"><form class="card" @submit.prevent="publish"><div class="eyebrow">新建活动与场次</div><h2>发布下一场活动</h2><label>活动名称<input v-model="draft.title" required maxlength="120"></label><label>活动说明<textarea v-model="draft.description" maxlength="2000"></textarea></label><label>场次名称<input v-model="draft.sessionTitle" required maxlength="120"></label><div class="fields"><label>名额<input v-model.number="draft.capacity" type="number" min="1" max="100000" required></label><label>价格（分，模拟）<input v-model.number="draft.priceCents" type="number" min="0" required></label></div><label>确认期限（秒）<input v-model.number="draft.holdSeconds" type="number" min="1" max="86400" required></label><button class="primary" :disabled="busy">创建并发布</button></form><div><form class="card" @submit.prevent="checkIn"><div class="eyebrow">入场管理</div><h2>核验入场凭证</h2><label>凭证编号<textarea v-model="checkToken" required></textarea></label><button class="primary">核验入场</button><p>仅本活动主办方或获授权的核验人员可操作，重复核验会被拒绝。</p></form><article class="card"><h2>候补队列</h2><label>场次<select v-model="waitSession" @change="loadWaitlist"><option value="">选择你管理的场次</option><option v-for="s in sessions.filter(s=>s.ownerId===account.user)" :value="s.id">{{s.title}}</option></select></label><p v-for="(w,i) in waitlist">{{i+1}} · {{w.userId}} · {{labels[w.status]||w.status}}</p><p v-if="waitSession&&!waitlist.length">暂无候补</p></article></div></div></section>
      <section v-if="page==='agent'"><p class="intro">固定仓库版本，带着证据调研。执行验证前需要你明确确认。</p><div class="two-columns"><form class="card" @submit.prevent="createJob"><div class="eyebrow">REPOLENS</div><h2>发起仓库调研</h2><label>工作区<select v-model="agent.workspace"><option v-for="w in workspaces" :value="w.id">{{w.name}}</option></select></label><div class="inline"><input v-model="workspaceName" placeholder="新工作区名称"><button type="button" @click="newWorkspace">创建</button></div><label>公开 GitHub 仓库<input v-model="agent.repo" placeholder="https://github.com/组织/仓库" required></label><label>完整 commit（40位）<input v-model="agent.commit" pattern="[a-fA-F0-9]{40}" required></label><label>问题或环境约束<textarea v-model="agent.question" required maxlength="4000" placeholder="依赖什么Python版本？证据在哪里？"></textarea></label><button class="primary" :disabled="busy||!agent.workspace">开始调研</button></form><div><article class="row-card" v-for="j in jobs" :key="j.id"><div><span class="badge">{{labels[j.status]||j.status}}</span><h3>{{j.question.slice(0,60)}}</h3><p class="mono">{{j.commitSha.slice(0,10)}}</p></div><div class="actions"><button @click="inspectJob(j)">查看</button><button v-if="['QUEUED','RUNNING','AWAITING_APPROVAL'].includes(j.status)" @click="cancelJob(j)">取消</button><button v-if="j.status==='FAILED'" @click="retryJob(j)" :disabled="busy">重试此任务</button></div></article><div class="empty" v-if="!jobs.length">调研记录会显示在这里。</div></div></div><article class="card" v-if="agent.workspace"><h2>参考资料包</h2><p>支持保存与校验12MB以内的ZIP附件。中断后重新选择同一文件可续传；附件不会替换固定版本的仓库源码。</p><input type="file" accept=".zip" :disabled="busy" @change="uploadArchive"><p role="status">{{uploadStatus}}</p><button v-if="uploadedArchive" @click="downloadArchive">下载已校验资料包</button></article><article class="card" v-if="selectedJob"><h2>调研过程</h2><p v-for="e in agentEvents">{{e.kind}} · {{eventText(e)}}</p><div class="approval" v-if="approval"><h3>请确认验证计划</h3><pre>{{JSON.stringify(approval.plan,null,2)}}</pre><p>执行来自公开仓库的代码有风险；这里是有资源限制的容器环境。</p><button class="primary" @click="decide(true)">批准这份计划</button><button @click="decide(false)">拒绝执行</button></div><div v-if="report"><h3>证据报告</h3><pre class="answer">{{report.answer}}</pre><ul><li v-for="c in report.citations"><a :href="c.url" target="_blank" rel="noopener noreferrer">{{(c.labels||[]).join(' ')}} · {{c.path}}:{{c.start_line}}–{{c.end_line}}</a></li></ul><p>{{report.warning}}</p><button @click="exportReport" :disabled="busy">导出证据报告</button><form @submit.prevent="followup"><label>继续追问同一仓库版本<textarea v-model="followupQuestion" maxlength="4000" required></textarea></label><button class="primary" :disabled="busy">发送追问</button></form></div></article></section>
      <section v-if="page==='checkin'"><form class="card" @submit.prevent="checkIn"><h2>核验入场凭证</h2><label>凭证编号<textarea v-model="checkToken" required></textarea></label><button class="primary">核验入场</button><p>仅可核验你已获授权的场次。</p></form></section><section v-if="page==='manage'"><form class="card" @submit.prevent="setChecker(true)"><h2>场次核验权限</h2><label>场次<select v-model="waitSession" required><option value="">选择场次</option><option v-for="s in sessions.filter(s=>s.ownerId===account.user)" :value="s.id">{{s.title}}</option></select></label><label>核验员账号<input v-model="checkerUser" required maxlength="80"></label><button class="primary" :disabled="busy">授予核验权限</button><button type="button" :disabled="busy||!waitSession||!checkerUser" @click="setChecker(false)">撤销权限</button></form></section><section v-if="page==='ops'"><article class="card"><h2>排查与重放</h2><p>仅列出发布终止重试或消费失败的事件。排除原因后可按原事件编号重放，操作会记录审计。</p><label>排查结果与重放原因<textarea v-model="replayReason" maxlength="400"></textarea></label><div class="row-card" v-for="e in failedMessages"><p>{{e.topic}} · {{e.status}} · 发布尝试 {{e.attempts}} 次</p><button @click="replayMessage(e)" :disabled="busy||!replayReason.trim()">按原编号重放</button></div><p v-if="!failedMessages.length">暂无待排查事件。</p></article></section><section v-if="page==='notifications'"><article class="row-card" v-for="n in notifications"><p>{{n.message}}</p></article><div class="empty" v-if="!notifications.length">暂无通知</div></section>
    </template>
    <p class="error" role="alert" v-if="error">{{error}}</p>
  </main><footer>EventFulfill × RepoLens · 本地学习与验证环境 · 支付仅为模拟</footer>
</div><script type="module" src="/app.js"></script></body></html>

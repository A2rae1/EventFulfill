receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 96, spike_limit_mib: 24}
  batch: {send_batch_size: 64, timeout: 1s}
exporters:
  otlp_http/tempo: {endpoint: 'http://tempo:4318'}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
